name: Resolve review threads

on:
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write

jobs:
  resolve-thread:
    name: resolve-thread
    runs-on: ubuntu-latest
    if: >-
      github.event.comment.user.login == 'aureviaeu' &&
      github.event.comment.in_reply_to_id &&
      (startsWith(github.event.comment.body, '[claude-fixed]') ||
       startsWith(github.event.comment.body, '[claude-declined]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the review thread
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IN_REPLY_TO_ID: ${{ github.event.comment.in_reply_to_id }}
        run: python3 scripts/resolve_review_thread.py
